name: Build Docker Image

on:
  push:
    tags:
      - "*"
  workflow_dispatch: {}


jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag music-bot:$(git rev-parse --short "$GITHUB_SHA")

